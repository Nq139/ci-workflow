name: "RMVL 文档构建与发布"

on:
  workflow_call:
    inputs:
      folder:
        description: documents folder under cv-rmvl.github.io/docs, for example 2.x
        required: true
        type: string
    secrets:
      DOCS_TOKEN:
        description: Token with Contents read and write access to cv-rmvl/cv-rmvl.github.io
        required: true

permissions:
  contents: read

# rdt pushes directly to the documents repository's master branch.
concurrency:
  group: rmvl-documents
  cancel-in-progress: false

jobs:
  build_docs:
    name: Documents build and publish
    runs-on: ubuntu-24.04
    steps:
    - name: "[RMVL] Validate documents folder"
      env:
        DOC_FOLDER: ${{ inputs.folder }}
      run: |
        if [[ ! "$DOC_FOLDER" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]; then
          echo '::error::folder must be a single directory name starting with a letter or digit and containing only letters, digits, dots, underscores or hyphens.'
          exit 1
        fi

    - name: "[RMVL] Install dependencies"
      run: |
        sudo apt-get update
        sudo apt-get install -y libeigen3-dev libopencv-dev libssl-dev python3-dev pybind11-dev python3-bs4 graphviz perl texlive-binaries

    - name: "[open62541] Checkout open62541 repository"
      uses: actions/checkout@v6
      with:
        repository: open62541/open62541
        ref: v1.5.4
        path: open62541
        persist-credentials: false

    - name: "[open62541] Build and install open62541"
      run: |
        cmake -S "$GITHUB_WORKSPACE/open62541" -B "$RUNNER_TEMP/open62541-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DUA_ENABLE_PUBSUB=ON
        cmake --build "$RUNNER_TEMP/open62541-build" --parallel
        sudo cmake --install "$RUNNER_TEMP/open62541-build"
        sudo ldconfig

    - name: "[RMVL] Checkout rmvl repository"
      uses: actions/checkout@v6

    - name: "[RMVL] Install Doxygen"
      working-directory: ${{ runner.temp }}
      run: |
        curl --fail --location --retry 3 https://www.doxygen.nl/files/doxygen-1.18.0.linux.bin.tar.gz -o doxygen-1.18.0.linux.bin.tar.gz
        echo '14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90  doxygen-1.18.0.linux.bin.tar.gz' | sha256sum --check
        tar -xzf doxygen-1.18.0.linux.bin.tar.gz
        sudo install -m 755 doxygen-1.18.0/bin/doxygen /usr/local/bin/doxygen
        doxygen_version="$(doxygen --version)"
        printf '%s\n' "$doxygen_version"
        test "${doxygen_version%% *}" = '1.18.0'

    - name: "[RDT] Checkout rdt repository"
      uses: actions/checkout@v6
      with:
        repository: cv-rmvl/rmvl-dev-tools
        path: rmvl-dev-tools
        persist-credentials: false

    - name: "[RDT] Build and install RMVL and Dev Tools"
      working-directory: ${{ github.workspace }}
      run: |
        bash "$GITHUB_WORKSPACE/rmvl-dev-tools/setup/bash/install.bash" "$GITHUB_WORKSPACE"
        sudo ldconfig
        echo "RMVL_ROOT_=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        echo "$GITHUB_WORKSPACE/rmvl-dev-tools/scripts/bash" >> "$GITHUB_PATH"

    - name: "[RDT] Build and publish documents"
      env:
        DOC_FOLDER: ${{ inputs.folder }}
        DOCS_TOKEN: ${{ secrets.DOCS_TOKEN }}
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
        # rdt uses an SSH URL internally. Use the supplied token for HTTPS instead.
        git config --global url."https://x-access-token:${DOCS_TOKEN}@github.com/cv-rmvl/".insteadOf 'git@github.com:cv-rmvl/'
        trap 'git config --global --remove-section "url.https://x-access-token:${DOCS_TOKEN}@github.com/cv-rmvl/"' EXIT
        rdt update doc "$DOC_FOLDER"
